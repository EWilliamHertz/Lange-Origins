name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-build:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  lifecycle-emulators:
    name: Character lifecycle (Firebase emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Download Firestore emulator
        run: npx firebase setup:emulators:firestore
      - name: Run lifecycle tests against Auth + Firestore emulators
        run: |
          set -o pipefail
          npx firebase emulators:exec --only auth,firestore --project demo-lange-origins \
            "npx vitest run tests/lifecycle.emulator.test.ts --reporter=verbose" \
            2>&1 | tee emulator-run.log
        env:
          FORCE_COLOR: "0"
      - name: Upload emulator log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-run-log
          path: emulator-run.log
